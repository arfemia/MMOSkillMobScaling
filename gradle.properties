group=Ziggfreed
name=MmoMobScaling
version=1.2.4
java_version=25
mod_description=MMO Mob Scaling - a standalone open-world mob difficulty-scaling system for the MMO Skill Tree.
website=https://mmo-skill-tree-docs.ziggfreed.com
game_build=latest
entry_point=com.ziggfreed.mmomobscaling.MobScalingPlugin

# Compile against the SAME jar the server runs (path built from
# hytaleHome/patchline/game_build in build.gradle). In a workspace, its family.properties'
# keys of the same names replace these; these values serve a build of this repo alone.
hytaleHome=D:/Games/Hytale/install
patchline=pre-release

# The workspace root, relative to this project dir: the folder whose family.properties maps every
# family repo and pack to its path. build.gradle reads the pinned jar through it:
# repo.ziggfreed-common, from its own build/libs.
workspaceRoot=../..

# Consumer pin (provided at runtime, compileOnly here - never bundled). MMO Skill Tree is no
# dependency of this mod (R597): it meets it only through ziggfreed-common's seams (player power,
# a creature's ability cast, the kill reward scale and qualifier), so it carries no MMO pin.
#
# THE LOCKSTEP RULE (R364): each pin here follows its sibling's own version in lockstep, so
# this mod always compiles against the jars the family builds (the umbrella's settings.gradle
# checks it). A ">=" floor in src/main/resources/manifest.json is the oldest version this mod
# really needs: it moves up only when the code starts using newer API, may sit below its pin,
# and never above it, so a library release alone never forces a release of this mod (R12).
# The LinkageError guards around the newer seams (the kill reward scale, the encounter
# runtime, the encounter power seam) are a safety net for a mis-installed server, never a
# licence to lower a floor below the API the code calls.
#
# ziggfreedCommonVersion: the shared primitive lib this mob-scaling mod builds on (its
# scaling/ engine is the fold, its world/ matcher the per-world Where, its ui/ toolkit the
# admin page, its cast/ primitives the Vampiric on-hit dispatch). 2.1.x is the boss
# framework: EncounterRuntime.isBoundSubject (the skip the deferred roll takes for a bound
# boss) and the EncounterPowerSource seam this mod fills, neither of which exists in 2.0.x.
# Runtime manifest floor: >=2.5.0 (a binding row's Scale.Companion, read through
# EncounterRuntime.companionScale for a companion-scaled boss).
ziggfreedCommonVersion=2.5.2

# Gradle itself, the same in every family repo so one daemon serves them all (a different value
# here starts a second daemon): projects build in parallel, task outputs go to the build cache
# (its folder is set in settings.gradle), a run whose build scripts and the files they read are
# unchanged reuses the configuration cache instead of configuring again, and an idle daemon exits
# after 30 minutes.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=1800000
