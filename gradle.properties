group=Ziggfreed
name=MmoMobScaling
version=1.2.1
java_version=25
mod_description=MMO Mob Scaling - a standalone open-world mob difficulty-scaling system for the MMO Skill Tree.
website=https://mmo-skill-tree-docs.ziggfreed.com
game_build=latest
entry_point=com.ziggfreed.mmomobscaling.MobScalingPlugin

# Compile against the SAME jar the server runs (path built from
# hytaleHome/patchline/game_build in build.gradle).
hytaleHome=D:/Games/Hytale/install
patchline=release

# The workspace root, relative to this project dir: the folder whose family.properties maps every
# family repo and pack to its path. build.gradle reads both pinned jars through it:
# repo.ziggfreed-common and repo.mmo-skills (the MMO's repo), each from its own build/libs.
workspaceRoot=../..

# Consumer pins (both provided at runtime, both compileOnly here - never bundled).
#
# THE LOCKSTEP RULE: this mod ships together with the ziggfreed-common and MMO Skill Tree
# versions it is built against, and its manifest floors ARE those versions. A pin here and
# the matching ">=" floor in src/main/resources/manifest.json move together, in the same
# change, whenever either dependency ships; a server that updates one jar updates the
# family. The LinkageError guards around the newer seams (the kill-rarity provider, the
# encounter runtime, the encounter power seam) are a safety net for a mis-installed server,
# never a licence to advertise compatibility with a jar this mod was not built against.
#
# ziggfreedCommonVersion: the shared primitive lib this mob-scaling mod builds on (its
# scaling/ engine is the fold, its world/ matcher the per-world Where, its ui/ toolkit the
# admin page, its cast/ primitives the Vampiric on-hit dispatch). 2.1.x is the boss
# framework: EncounterRuntime.isBoundSubject (the skip the deferred roll takes for a bound
# boss) and the EncounterPowerSource seam this mod fills, neither of which exists in 2.0.x.
# 2.2.0 is the build this one ships beside, so it is the one to compile against.
# Runtime manifest floor: >=2.2.0.
ziggfreedCommonVersion=2.2.0
#
# mmoSkillTreeVersion: the LOCAL hyMMO dev jar we compileOnly against (see build.gradle for
# the resolved path). The API this mod uses has been frozen since 1.6.1: the
# getPowerLevel/statRewardSum/getCombatLevel reads, registerMobKillXpMultiplier,
# registerKillRarityProvider and castNpcAbility(Store, Ref, String) (the caster roster's
# ABILITY entries). The pin names the jar the monorepo actually BUILDS, not the oldest jar
# that would satisfy the compile - a pin naming a version nobody builds any more resolves to
# a missing file, and the compile then fails with "package does not exist" for every MMO
# import rather than saying the jar is absent.
# Runtime manifest floor: >=1.7.0.
mmoSkillTreeVersion=1.7.0

# Gradle itself, the same in every family repo so one daemon serves them all (a different value
# here starts a second daemon): projects build in parallel, task outputs go to the build cache
# (its folder is set in settings.gradle), and an idle daemon exits after 30 minutes. The
# configuration cache stays off.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=1800000
