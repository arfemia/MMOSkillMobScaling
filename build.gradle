plugins {
    id 'java'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

group = project.group
version = project.version

repositories {
    mavenCentral()
}

// ============================================================================
// VERSION STORY (intentional, do not "fix"):
//   This mod compileOnly-references the LOCAL MMOSkillTree-<mmoSkillTreeVersion>.jar
//   (1.6.0), which carries the frozen 1.5.0 API surface the scaling systems call
//   (getPowerLevel / getPowerLevelMin / getPowerLevelMax / statRewardSum / getCombatLevel,
//   plus the registerMobKillXpMultiplier reward hook) PLUS (1.1.0) castNpcAbility(Store,
//   Ref, String), the API the caster roster's ABILITY entries call. Its manifest,
//   however, pins the RUNTIME requirement at "Ziggfreed:MMOSkillTree": ">=1.5.0", not
//   1.6.0. So: compile against the 1.6.0 dev jar, require only 1.5.0 at runtime. This is
//   deliberate: only the ABILITY caster entries need castNpcAbility, and they degrade
//   gracefully (one session warning via caster/CasterFeatureState) rather than crashing
//   when the runtime jar is older than the dev jar this compiled against - see that
//   class's javadoc. HP scaling, rarities/affixes/variants, the HUD, and NativeChain
//   caster entries all still work unchanged on a plain 1.5.0 runtime jar.
// ============================================================================

// Compile against the SAME jar the server runs (path in gradle.properties).
def hytaleServerJar  = new File("${hytaleHome}/${patchline}/package/game/${game_build}/Server/HytaleServer.jar")
// The shared primitive lib (sibling submodule), local jar until a remote gitlink exists.
def ziggfreedCommonJar = new File("${rootDir}/../ziggfreed-common/build/libs/ZiggfreedCommon-${ziggfreedCommonVersion}.jar")
// The hyMMO mod jar (the umbrella repo's build/libs), the dev jar with the frozen 1.5.0 API.
def mmoSkillTreeJar    = new File("${rootDir}/../../build/libs/MMOSkillTree-${mmoSkillTreeVersion}.jar")

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gradle 9 requires the JUnit Platform launcher on the test runtime classpath.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // jsr305 for @Nonnull/@Nullable, like ziggfreed-common.
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    // All three provided jars are loaded by the server BEFORE this mod (manifest
    // Dependencies), so we NEVER bundle any of them - bundling would double-load
    // engine-touching classes under two classloaders and break class identity.
    compileOnly(files(hytaleServerJar))
    compileOnly(files(ziggfreedCommonJar))
    compileOnly(files(mmoSkillTreeJar))

    // Config is driven by a Hytale asset codec (MobScalingSettingsAsset, decoded via
    // CODEC.decodeJson from the HytaleServer codec classes) - no gson needed.

    // Tests compile + run the codec-driven config, which needs the server jar (codec +
    // RawJsonReader classes) on the TEST classpath, plus the common + MMO jars for the
    // rest of the mod. These are testImplementation (real, on the test classpath).
    testImplementation(files(hytaleServerJar))
    testImplementation(files(ziggfreedCommonJar))
    testImplementation(files(mmoSkillTreeJar))
}

// Never call a deprecated engine API (repo-wide sibling-mod edict, additional-mods/CLAUDE.md,
// 2026-07-22): -Xlint:removal surfaces every Hytale API annotated @Deprecated(forRemoval = true)
// still in use, and -Werror promotes that warning to a hard compile failure, mirroring the hyMMO
// jar's own compileJava flag. A future Hytale server update that deprecates-for-removal an API
// this mod calls will now fail the build on sight instead of silently degrading toward a removed
// API. compileJava only (not compileTestJava), matching the hyMMO jar's own scoping. Two plain
// (non-removal) @Deprecated warnings remain uncaught by this flag by design (DamageSystems
// .ArmorDamageReduction and ISpawnProvider.getSpawnPoints()) - both are the only way to reach
// what they name (the engine's own DamageModule still registers ArmorDamageReduction as a live
// ordering target; first-party SpawnCommand itself still calls getSpawnPoints() for the same
// "every spawn point, no player context" need), confirmed against the shared source.
compileJava {
    options.compilerArgs << '-Xlint:removal' << '-Werror'
}

test {
    useJUnitPlatform()
}

processResources {
    var expandProps = [
            'name'           : project.name,
            'version'        : project.version,
            'group'          : project.group,
            'mod_description': project.findProperty('mod_description') ?: '',
            'website'        : project.findProperty('website') ?: '',
            'entry_point'    : project.findProperty('entry_point') ?: ''
    ]

    filesMatching(['manifest.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
